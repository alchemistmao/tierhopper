<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#131820"/><stop offset="1" stop-color="#07090d"/></radialGradient>
    <linearGradient id="trail" x1="0" x2="1"><stop offset="0" stop-color="#5ee0ff" stop-opacity=".15"/><stop offset=".6" stop-color="#5ee0ff"/><stop offset="1" stop-color="#b6ff5e"/></linearGradient>
    <radialGradient id="coin" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffe680"/><stop offset=".6" stop-color="#facc15"/><stop offset="1" stop-color="#b8860b"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="560" fill="url(#bg)"/>
  <path d="M40 440 H760" stroke="#1c2330" stroke-width="4"/>
  <!-- the coins it refuses to touch -->
  <g transform="translate(300 392)">
    <ellipse cx="0" cy="48" rx="56" ry="9" fill="#000" opacity=".45"/>
    <circle r="46" fill="url(#coin)" stroke="#8a6508" stroke-width="5"/>
    <circle r="34" fill="none" stroke="#8a6508" stroke-width="3" opacity=".6"/>
    <text y="17" text-anchor="middle" font-family="Helvetica Neue, Arial" font-weight="800" font-size="50" fill="#7a5a06">$</text>
  </g>
  <g transform="translate(520 404) scale(.75)">
    <ellipse cx="0" cy="48" rx="56" ry="9" fill="#000" opacity=".45"/>
    <circle r="46" fill="url(#coin)" stroke="#8a6508" stroke-width="5"/>
    <text y="17" text-anchor="middle" font-family="Helvetica Neue, Arial" font-weight="800" font-size="50" fill="#7a5a06">$</text>
  </g>
  <!-- the hop path that very deliberately avoids them -->
  <path d="M90 436 Q190 120 300 300 Q340 360 410 300 Q470 120 620 240 Q680 290 700 430" fill="none" stroke="url(#trail)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="90" cy="436" r="12" fill="#5ee0ff" opacity=".5"/>
  <!-- arrowhead landing -->
  <path d="M676 406 L702 438 L724 400" fill="none" stroke="#b6ff5e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- comic labels -->
  <text x="190" y="150" font-family="Menlo, monospace" font-size="26" fill="#8b95a5" transform="rotate(-10 190 150)">*boing*</text>
  <text x="440" y="150" font-family="Menlo, monospace" font-size="26" fill="#8b95a5" transform="rotate(8 440 150)">*boing*</text>
  <text x="300" y="300" text-anchor="middle" font-family="Menlo, monospace" font-size="20" fill="#f87171">nope</text>
  <text x="520" y="330" text-anchor="middle" font-family="Menlo, monospace" font-size="18" fill="#f87171">nope</text>
  <text x="400" y="520" text-anchor="middle" font-family="Menlo, monospace" font-weight="700" font-size="34" fill="#e6edf3">tier<tspan fill="#5ee0ff">/</tspan>hopper</text>
  <text x="400" y="552" text-anchor="middle" font-family="Helvetica Neue, Arial" font-weight="700" font-size="20" fill="#8b95a5" letter-spacing="1">YOUR GPU BILL, DODGED.</text>
</svg>
