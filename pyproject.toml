[project]
name = "tierhopper"
version = "0.2.0"
description = "Run GPU jobs on free cloud GPU tiers from Claude Code, hopping to the next provider when one runs out."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mauro Orlando" }]
requires-python = ">=3.12,<3.14"
keywords = ["gpu", "mcp", "claude-code", "kaggle", "modal", "free-tier"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Local mode: everything needed to run jobs on Kaggle and Modal from Claude Code.
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "keyring>=25.0",
    "typer>=0.12",
    "fastmcp>=4.0.10",
    "kaggle>=2.2.4",
    "modal>=1.6.0",
]

[project.optional-dependencies]
# Full mode: your own Supabase state, R2 checkpoints, Lightning AI, dashboard commands, WhatsApp/push.
full = [
    "supabase>=2.31.0",
    "boto3>=1.43.105",
    "lightning-sdk>=2026.9.18.post1",
    "anthropic>=1.11.0",
    "pywebpush>=2.5.0",
]

[project.urls]
Homepage = "https://github.com/alchemistmao/tierhopper"
Issues = "https://github.com/alchemistmao/tierhopper/issues"

[project.scripts]
tierhopper = "tierhopper.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "tierhopper[full]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tierhopper"]

[tool.hatch.build.targets.wheel.force-include]
"examples/hello-gpu" = "tierhopper/examples/hello-gpu"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
